name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  octave:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GNU Octave
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends octave
      - name: Run tests
        run: octave --no-gui --no-window-system --eval "addpath('tests'); run_tests"
      - name: Run full analysis
        run: octave --no-gui --no-window-system --eval "run_analysis('Plot', false)"
